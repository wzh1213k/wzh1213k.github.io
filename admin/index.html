<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>博客管理</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✏️</text></svg>">
<style>
:root {
  --bg: #f8fafc;
  --surface: #ffffff;
  --border: #e2e8f0;
  --text: #1e293b;
  --text-secondary: #64748b;
  --primary: #2563eb;
  --primary-hover: #1d4ed8;
  --success: #22c55e;
  --danger: #ef4444;
  --radius: 8px;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.6;
}
.sidebar {
  position: fixed; top: 0; left: 0; bottom: 0; width: 280px;
  background: var(--surface);
  border-right: 1px solid var(--border);
  display: flex; flex-direction: column;
}
.sidebar-header {
  padding: 16px 20px;
  border-bottom: 1px solid var(--border);
}
.sidebar-header h1 { font-size: 18px; font-weight: 700; }
.sidebar-header p { font-size: 12px; color: var(--text-secondary); margin-top: 2px; }
.login-form { padding: 16px 20px; border-bottom: 1px solid var(--border); }
.login-form input {
  width: 100%; padding: 8px 12px; border: 1px solid var(--border);
  border-radius: var(--radius); font-size: 13px; margin-bottom: 8px;
}
.login-form input:focus { outline: none; border-color: var(--primary); }
.btn {
  display: inline-flex; align-items: center; justify-content: center;
  padding: 8px 16px; border-radius: var(--radius); font-size: 13px;
  font-weight: 500; border: none; cursor: pointer; transition: all 0.15s;
}
.btn-primary { background: var(--primary); color: white; }
.btn-primary:hover { background: var(--primary-hover); }
.btn-sm { padding: 4px 10px; font-size: 12px; }
.btn-outline { background: transparent; border: 1px solid var(--border); color: var(--text); }
.btn-outline:hover { background: var(--bg); }
.btn-danger { background: var(--danger); color: white; font-size: 12px; }
.post-list { flex: 1; overflow-y: auto; padding: 8px; }
.post-item {
  padding: 10px 12px; border-radius: var(--radius);
  cursor: pointer; transition: background 0.15s;
  border: 1px solid transparent;
}
.post-item:hover { background: var(--bg); }
.post-item.active { background: #eff6ff; border-color: var(--primary); }
.post-item-title { font-size: 13px; font-weight: 600; margin-bottom: 2px; }
.post-item-meta { font-size: 11px; color: var(--text-secondary); }
.new-post-btn {
  margin: 8px; padding: 8px; border-radius: var(--radius);
  border: 2px dashed var(--border); background: transparent;
  color: var(--text-secondary); font-size: 13px; cursor: pointer; transition: all 0.15s;
}
.new-post-btn:hover { border-color: var(--primary); color: var(--primary); background: #eff6ff; }

.main { margin-left: 280px; display: flex; flex-direction: column; min-height: 100vh; }
.toolbar {
  padding: 12px 24px; border-bottom: 1px solid var(--border);
  background: var(--surface); display: flex; align-items: center; gap: 8px;
}
.toolbar-right { margin-left: auto; display: flex; gap: 8px; align-items: center; }
.editor-section { flex: 1; display: flex; flex-direction: column; }
.editor-form { padding: 20px 24px; flex: 1; display: flex; flex-direction: column; gap: 12px; }
.form-group { display: flex; flex-direction: column; gap: 4px; }
.form-group label { font-size: 12px; font-weight: 600; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.5px; }
.form-group input, .form-group textarea {
  padding: 8px 12px; border: 1px solid var(--border); border-radius: var(--radius);
  font-size: 14px; font-family: inherit;
}
.form-group input:focus, .form-group textarea:focus { outline: none; border-color: var(--primary); }
.form-group textarea { flex: 1; min-height: 300px; resize: vertical; font-family: 'JetBrains Mono', 'SF Mono', monospace; font-size: 13px; line-height: 1.7; }
.tags-input { display: flex; flex-wrap: wrap; gap: 4px; }
.tag {
  display: inline-flex; align-items: center; gap: 2px;
  padding: 2px 8px; border-radius: 4px; background: #eff6ff;
  color: var(--primary); font-size: 12px;
}
.tag-remove { cursor: pointer; font-size: 14px; line-height: 1; opacity: 0.6; }
.tag-remove:hover { opacity: 1; }
.tag-add { display: flex; gap: 4px; align-items: center; }
.tag-add input { width: 100px; padding: 4px 8px; font-size: 12px; border: 1px solid var(--border); border-radius: 4px; }
.status-bar {
  padding: 8px 24px; background: var(--surface); border-top: 1px solid var(--border);
  font-size: 12px; color: var(--text-secondary); display: flex; justify-content: space-between;
}
.message { padding: 8px 16px; border-radius: var(--radius); font-size: 13px; }
.message-success { background: #f0fdf4; color: #166534; border: 1px solid #bbf7d0; }
.message-error { background: #fef2f2; color: #991b1b; border: 1px solid #fecaca; }
.hidden { display: none !important; }
.empty-state {
  display: flex; align-items: center; justify-content: center;
  flex: 1; color: var(--text-secondary); font-size: 14px;
}
.login-prompt {
  display: flex; align-items: center; justify-content: center;
  flex: 1; padding: 40px;
}
.login-prompt-inner { max-width: 400px; text-align: center; }
.login-prompt-inner h2 { margin-bottom: 8px; }
.login-prompt-inner p { color: var(--text-secondary); font-size: 14px; margin-bottom: 24px; }
.login-prompt-inner input { width: 100%; padding: 10px 14px; border: 1px solid var(--border); border-radius: var(--radius); font-size: 14px; margin-bottom: 12px; }
.login-prompt-inner small { display: block; color: var(--text-secondary); font-size: 11px; margin-top: 8px; }
@media (max-width: 768px) {
  .sidebar { display: none; }
  .sidebar.mobile-show { display: flex; position: fixed; z-index: 100; width: 100%; }
  .main { margin-left: 0; }
}
</style>
</head>
<body>

<div class="sidebar" id="sidebar">
  <div class="sidebar-header">
    <h1>有个网友</h1>
    <p>博客管理后台</p>
  </div>
  <div class="login-form" id="login-section">
    <input type="password" id="token-input" placeholder="GitHub Token" />
    <button class="btn btn-primary" id="login-btn" style="width:100%">连接 GitHub</button>
    <small style="display:block;margin-top:6px;font-size:11px;color:var(--text-secondary)">
      Token 仅存在浏览器，不会上传到别处
    </small>
  </div>
  <button class="new-post-btn" id="new-post-btn">+ 新文章</button>
  <div class="post-list" id="post-list"></div>
</div>

<div class="main" id="main">
  <div class="toolbar">
    <span id="current-title" style="font-weight:600;font-size:14px">没选中文章</span>
    <div class="toolbar-right">
      <span id="saving-indicator" class="hidden" style="font-size:12px;color:var(--text-secondary)">保存中...</span>
      <button class="btn btn-outline btn-sm" id="preview-btn">预览</button>
      <button class="btn btn-primary btn-sm" id="save-btn">保存</button>
    </div>
  </div>

  <div class="login-prompt" id="login-prompt">
    <div class="login-prompt-inner">
      <h2>🔐 需要登录</h2>
      <p>输入 GitHub Personal Access Token 来管理文章</p>
      <input type="password" id="prompt-token" placeholder="GitHub Token" />
      <button class="btn btn-primary" id="prompt-login-btn">连接</button>
      <small>Token 需要 repo 权限。可在 GitHub Settings → Developer settings → Personal access tokens 生成</small>
    </div>
  </div>

  <div class="editor-section hidden" id="editor-section">
    <div class="editor-form">
      <div class="form-group">
        <label>标题</label>
        <input type="text" id="post-title" placeholder="文章标题" />
      </div>
      <div class="form-group">
        <label>描述</label>
        <input type="text" id="post-desc" placeholder="简短描述" />
      </div>
      <div class="form-group">
        <label>标签</label>
        <div class="tags-input" id="tags-container"></div>
        <div class="tag-add">
          <input type="text" id="tag-input" placeholder="添加标签" />
          <button class="btn btn-outline btn-sm" id="add-tag-btn">添加</button>
        </div>
      </div>
      <div class="form-group" style="flex:1">
        <label>内容 (Markdown)</label>
        <textarea id="post-content" placeholder="用 Markdown 写文章..."></textarea>
      </div>
    </div>
  </div>

  <div class="empty-state" id="empty-state">
    <div style="text-align:center">
      <div style="font-size:48px;margin-bottom:12px">📝</div>
      <p>从左侧选择一篇文章编辑，或点「+ 新文章」</p>
    </div>
  </div>

  <div class="status-bar">
    <span id="status-connection">未连接</span>
    <span id="status-info"></span>
  </div>
</div>

<!-- Preview Modal -->
<div id="preview-modal" class="hidden" style="position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.5);z-index:200;display:flex;align-items:center;justify-content:center;">
  <div style="background:white;border-radius:12px;width:90%;max-width:800px;max-height:90vh;display:flex;flex-direction:column;">
    <div style="padding:16px 20px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;">
      <h3 id="preview-title" style="font-size:16px;font-weight:600">预览</h3>
      <button class="btn btn-outline btn-sm" id="close-preview-btn">关闭</button>
    </div>
    <div id="preview-content" style="padding:20px;overflow-y:auto;line-height:1.8;font-size:15px;color:#334155;"></div>
  </div>
</div>

<script>
const REPO = "wzh1213k/wzh1213k.github.io";
const BRANCH = "main";
const POST_PATH = "src/content/posts";

let token = localStorage.getItem("gh_token") || "";
let posts = [];
let currentSlug = null;
let isSaving = false;

function $(id) { return document.getElementById(id); }

function init() {
  if (token) {
    $("token-input").value = token;
    connect();
  } else {
    showLoginPrompt();
  }
}

function showLoginPrompt() {
  $("login-prompt").classList.remove("hidden");
  $("editor-section").classList.add("hidden");
  $("empty-state").classList.add("hidden");
}

function connect() {
  token = $("token-input").value.trim();
  if (!token) return;
  localStorage.setItem("gh_token", token);
  $("login-prompt").classList.add("hidden");
  $("status-connection").textContent = "已连接";
  loadPosts();
}

$("login-btn").addEventListener("click", connect);
$("prompt-login-btn").addEventListener("click", connect);
$("prompt-token").addEventListener("keydown", e => { if (e.key === "Enter") connect(); });
$("token-input").addEventListener("keydown", e => { if (e.key === "Enter") connect(); });

async function api(method, path, body) {
  const url = `https://api.github.com${path}`;
  const options = {
    method,
    headers: {
      Authorization: `Bearer ${token}`,
      Accept: "application/vnd.github.v3+json",
    },
  };
  if (body) {
    options.headers["Content-Type"] = "application/json";
    options.body = JSON.stringify(body);
  }
  const res = await fetch(url, options);
  if (!res.ok) {
    const err = await res.json().catch(() => ({}));
    throw new Error(err.message || `HTTP ${res.status}`);
  }
  return method === "GET" ? res.json() : null;
}

async function loadPosts() {
  try {
    const data = await api("GET", `/repos/${REPO}/contents/${POST_PATH}?ref=${BRANCH}`);
    posts = Array.isArray(data) ? data.filter(f => f.name.endsWith(".md")) : [];
    renderPostList();
    $("status-info").textContent = `${posts.length} 篇文章`;
    $("empty-state").classList.remove("hidden");
  } catch (e) {
    showError("加载文章失败: " + e.message);
  }
}

function renderPostList() {
  const el = $("post-list");
  el.innerHTML = posts
    .sort((a, b) => a.name.localeCompare(b.name))
    .map(p => `<div class="post-item${p.name === currentSlug ? ' active' : ''}" data-slug="${p.name}">
      <div class="post-item-title">${p.name.replace(".md", "")}</div>
      <div class="post-item-meta">${p.name}</div>
    </div>`)
    .join("");
  el.querySelectorAll(".post-item").forEach(item => {
    item.addEventListener("click", () => loadPost(item.dataset.slug));
  });
}

async function loadPost(slug) {
  currentSlug = slug;
  renderPostList();
  try {
    const data = await api("GET", `/repos/${REPO}/contents/${POST_PATH}/${slug}?ref=${BRANCH}`);
    const content = atob(data.content.replace(/\n/g, ""));
    parseFrontmatter(content);
    $("editor-section").classList.remove("hidden");
    $("empty-state").classList.add("hidden");
    $("current-title").textContent = slug.replace(".md", "");
    $("status-info").textContent = "正在编辑: " + slug;
  } catch (e) {
    showError("加载文章失败: " + e.message);
  }
}

function parseFrontmatter(content) {
  const match = content.match(/^---\s*\n([\s\S]*?)\n---\s*\n([\s\S]*)$/);
  if (!match) {
    $("post-title").value = "";
    $("post-desc").value = "";
    renderTags([]);
    $("post-content").value = content;
    return;
  }
  const fm = match[1];
  const body = match[2];
  
  const title = fm.match(/title:\s*(.+)/);
  const desc = fm.match(/description:\s*(.+)/);
  const tagsMatch = fm.match(/tags:\s*\n((?:\s*-\s*.+\n?)*)/);
  
  $("post-title").value = title ? title[1].replace(/["']/g, "") : "";
  $("post-desc").value = desc ? desc[1].replace(/["']/g, "") : "";
  
  const tags = tagsMatch 
    ? [...tagsMatch[1].matchAll(/- (.+)/g)].map(m => m[1].trim())
    : [];
  renderTags(tags);
  $("post-content").value = body.trim();
}

function buildFrontmatter() {
  const title = $("post-title").value.trim();
  const desc = $("post-desc").value.trim();
  const content = $("post-content").value.trim();
  const tags = getTags();
  
  let fm = "---\n";
  if (title) fm += `title: ${title}\n`;
  if (desc) fm += `description: ${desc}\n`;
  fm += `pubDatetime: ${new Date().toISOString().split("T")[0]}\n`;
  if (tags.length) {
    fm += "tags:\n";
    tags.forEach(t => { fm += `  - ${t}\n`; });
  }
  fm += "---\n\n";
  return fm + content;
}

function getTags() {
  return [...document.querySelectorAll("#tags-container .tag")].map(el => el.dataset.tag);
}

function renderTags(tags) {
  const el = $("tags-container");
  el.innerHTML = tags.map(t => `
    <span class="tag" data-tag="${t}">
      ${t}
      <span class="tag-remove" data-tag="${t}">×</span>
    </span>
  `).join("");
  el.querySelectorAll(".tag-remove").forEach(btn => {
    btn.addEventListener("click", () => {
      const tag = btn.dataset.tag;
      renderTags(getTags().filter(t => t !== tag));
    });
  });
}

$("add-tag-btn").addEventListener("click", () => {
  const input = $("tag-input");
  const tag = input.value.trim();
  if (tag && !getTags().includes(tag)) {
    renderTags([...getTags(), tag]);
    input.value = "";
  }
});
$("tag-input").addEventListener("keydown", e => {
  if (e.key === "Enter") { e.preventDefault(); $("add-tag-btn").click(); }
});

async function savePost() {
  if (!currentSlug || isSaving) return;
  isSaving = true;
  $("saving-indicator").classList.remove("hidden");
  
  try {
    // Get current file SHA
    let sha = null;
    try {
      const data = await api("GET", `/repos/${REPO}/contents/${POST_PATH}/${currentSlug}?ref=${BRANCH}`);
      sha = data.sha;
    } catch (e) { /* new file */ }
    
    const content = buildFrontmatter();
    const encoded = btoa(unescape(encodeURIComponent(content)));
    
    await api("PUT", `/repos/${REPO}/contents/${POST_PATH}/${currentSlug}`, {
      message: `编辑文章: ${currentSlug.replace(".md", "")}`,
      content: encoded,
      sha,
      branch: BRANCH,
    });
    
    $("status-info").textContent = "✅ 已保存，将自动部署";
    setTimeout(() => { $("status-info").textContent = "正在编辑: " + currentSlug; }, 3000);
  } catch (e) {
    showError("保存失败: " + e.message);
  } finally {
    isSaving = false;
    $("saving-indicator").classList.add("hidden");
  }
}

$("save-btn").addEventListener("click", savePost);

function newPost() {
  const slug = prompt("文件名（不含 .md）：", "new-post");
  if (!slug) return;
  currentSlug = slug + ".md";
  $("post-title").value = "";
  $("post-desc").value = "";
  renderTags([]);
  $("post-content").value = "";
  $("editor-section").classList.remove("hidden");
  $("empty-state").classList.add("hidden");
  $("current-title").textContent = currentSlug;
  $("status-info").textContent = "新文章: " + currentSlug;
  renderPostList();
  // Auto-focus title
  $("post-title").focus();
}

$("new-post-btn").addEventListener("click", newPost);

// Preview
$("preview-btn").addEventListener("click", () => {
  const title = $("post-title").value || "无标题";
  const content = $("post-content").value || "无内容";
  $("preview-title").textContent = title;
  
  // Simple markdown to HTML
  let html = content
    .replace(/^### (.+)$/gm, "<h3>$1</h3>")
    .replace(/^## (.+)$/gm, "<h2>$1</h2>")
    .replace(/^# (.+)$/gm, "<h1>$1</h1>")
    .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
    .replace(/\*(.+?)\*/g, "<em>$1</em>")
    .replace(/`(.+?)`/g, "<code style='background:#f1f5f9;padding:2px 6px;border-radius:3px;font-size:0.9em'>$1</code>")
    .replace(/^- (.+)$/gm, "<li>$1</li>")
    .replace(/(<li>.*<\/li>\n?)+/g, "<ul>$&</ul>")
    .replace(/^> (.+)$/gm, "<blockquote style='border-left:3px solid #2563eb;padding:8px 16px;margin:16px 0;background:#f8fafc'>$1</blockquote>")
    .replace(/```(\w*)\n([\s\S]*?)```/g, "<pre style='background:#1e293b;color:#e2e8f0;padding:16px;border-radius:8px;overflow-x:auto;font-size:13px'><code>$2</code></pre>")
    .replace(/\n\n/g, "</p><p>")
    .replace(/\n/g, "<br>");
  html = `<h1 style="font-size:24px;margin-bottom:8px">${title}</h1><p>${html}</p>`;
  
  $("preview-content").innerHTML = html;
  $("preview-modal").classList.remove("hidden");
});
$("close-preview-btn").addEventListener("click", () => {
  $("preview-modal").classList.add("hidden");
});

// Keyboard shortcuts
document.addEventListener("keydown", e => {
  if ((e.ctrlKey || e.metaKey) && e.key === "s") {
    e.preventDefault();
    savePost();
  }
});

function showError(msg) {
  $("status-info").textContent = "❌ " + msg;
  setTimeout(() => { $("status-info").textContent = ""; }, 5000);
}

// Hide login section once connected
{
  const origConnect = connect;
  connect = function() {
    origConnect();
    if (token) $("login-section").classList.add("hidden");
  };
}

init();
</script>
</body>
</html>
